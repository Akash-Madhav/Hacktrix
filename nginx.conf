# ==============================================================================
# NIRIKSHA — Enterprise Production Nginx Configuration
# Reference: AICTE Problem Statement 26262 Reverse Proxy & Edge Hardening
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M; # Accommodates multi-document PDF institutional dossiers

    # Rate Limiting (DDoS & Brute Force Protection)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # GZip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # Upstream Gunicorn / Uvicorn ASGI Cluster
    upstream niriksha_backend {
        server 127.0.0.1:8000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name niriksha.aicte-india.org localhost;

        # Redirect plain HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Static Assets Caching (Vite production bundle hashes ensure immutability)
        location /assets/ {
            proxy_pass http://niriksha_backend/assets/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Health Probes (No rate limiting for orchestrator heartbeats)
        location /health {
            proxy_pass http://niriksha_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # Main API and SPA Catch-all
        location / {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn addr_limit 50;

            proxy_pass http://niriksha_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $request_id;

            # WebSocket Support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Proxy Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
